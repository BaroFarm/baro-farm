<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>상품 기본 등록</title>
</head>
<body>
  <h1>상품 기본 정보 입력 페이지</h1>

  <form id="product-form">
    <label>상품명:
      <input type="text" name="title" required>
    </label>
    <br/><br/>

    <label>카테고리:
      <select name="category" required>
        <option value="">선택</option>
        <option value="쌀, 잡곡">쌀, 잡곡</option>
        <option value="채소, 버섯">채소, 버섯</option>
        <option value="과일, 견과">과일, 견과</option>
        <option value="축산, 축산가공">축산, 축산가공</option>
        <option value="수산물">수산물</option>
        <option value="반찬, 양념, 가루">반찬, 양념, 가루</option>
        <option value="식사대용, 간편식">식사대용, 간편식</option>
        <option value="간식, 음료, 유제품">간식, 음료, 유제품</option>
        <option value="건강, 차">건강, 차</option>
      </select>
    </label>
    <br/><br/>

    <label>용량:
      <input type="text" name="weight" required>
    </label>
    <br/><br/>

    <label>가격:
      <input type="number" name="price" required>
    </label>
    <br/><br/>

    <label>직매장:
      <select name="direct_store" required>
        <option value="">선택</option>
        <option value="A">A</option>
        <option value="B">B</option>
        <option value="C">C</option>
        <option value="D">D</option>
      </select>
    </label>
    <br/><br/>

    <label>반품 가능 여부:</label><br/>
    <input type="radio" name="returnable" value="true" id="returnable-yes" required>
    <label for="returnable-yes">반품 가능</label><br/>
    <input type="radio" name="returnable" value="false" id="returnable-no">
    <label for="returnable-no">반품 불가능</label><br/><br/>

    <button type="submit">다음 단계로 이동</button>
  </form>

  <script>
    document.getElementById('product-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      const form = e.target;

      const payload = {
        title: form.title.value,
        category: form.category.value,
        weight: form.weight.value,
        price: parseInt(form.price.value),
        direct_store: form.direct_store.value,
        returnable: form.returnable.value === "true"
      };

      // 카테고리명 → ID로 매핑
      const categoryMap = {
        '쌀, 잡곡': 1,
        '채소, 버섯': 2,
        '과일, 견과': 3,
        '축산, 축산가공': 4,
        '수산물': 5,
        '반찬, 양념, 가루': 6,
        '식사대용, 간편식': 7,
        '간식, 음료, 유제품': 8,
        '건강, 차': 9
      };

      const directStoreMap = { A: 10, B: 11, C: 12, D: 13 };

      payload.category_id = categoryMap[payload.category];
      payload.direct_store_id = directStoreMap[payload.direct_store];
      payload.seller_id = 1; // 테스트용 판매자 ID
      payload.status = '판매중';
      payload.description = '-';
      payload.intro = '-';
      payload.is_video = false;
      payload.video_url = null;
      payload.created_at = new Date().toISOString();

      try {
        const res = await fetch('/api/s-products/basic', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();

        // ✅ 수정: product.product_id → product.id
        if (res.ok && data.product?.product_id) {
          alert('상품이 등록되었습니다.');
          const productId = data.product.product_id;
          window.location.href = `/api/s-products/${productId}/images`;
        } else {
          alert(`등록 실패: ${data.details || '알 수 없는 오류'}`);
        }
      } catch (err) {
        alert('서버 요청 중 오류 발생: ' + err.message);
      }
    });
  </script>
</body>
</html>
