<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>AI 설명 생성</title>
</head>
<body>
  <h1>AI 설명 생성</h1>

  <label>대표 키워드:
    <input type="text" id="keywords" placeholder="예: 당근, 신선함, 무농약">
  </label>
  <br/><br/>

  <button id="generate-button">AI 설명 생성</button>

  <h3>🔽 생성된 설명:</h3>
  <div id="ai-description" style="border:1px solid #ccc; padding:10px; min-height:60px;"></div>

  <br/>
  <button id="use-description">AI 설명 사용하기</button>
  <button id="manual-description">직접 쓰기</button>

  <script>
    const productId = window.location.pathname.split('/')[3]; // /api/s-products/{product_id}/description/ai-gen

    // AI 설명 생성
    document.getElementById('generate-button').addEventListener('click', async () => {
      const keywords = document.getElementById('keywords').value;
      if (!keywords) {
        alert("키워드를 입력해주세요.");
        return;
      }

      const res = await fetch(`/api/s-products/${productId}/description/ai-gen`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ keywords })
      });

      const data = await res.json();
      if (res.ok) {
        document.getElementById('ai-description').innerText = data.generatedDescription;
      } else {
        alert('생성 실패: ' + data.message);
      }
    });

    // "AI 설명 사용하기" 버튼
    document.getElementById('use-description').addEventListener('click', async () => {
      const description = document.getElementById('ai-description').innerText;

      if (!description) {
        alert('AI 설명이 없습니다. 먼저 생성을 해주세요.');
        return;
      }

      const res = await fetch(`/api/s-products/${productId}/description/ai-save`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ description })
      });

      const data = await res.json();
      if (res.ok) {
        alert('AI 설명이 저장되었습니다!');
        // ✅ 저장 성공 시 summary 페이지로 이동
        window.location.href = `/api/s-products/${productId}/description/summary`;
      } else {
        alert('저장 실패: ' + data.message);
      }
    });

    // "직접 쓰기" 버튼
    document.getElementById('manual-description').addEventListener('click', () => {
      window.location.href = `/api/s-products/${productId}/description/manual`;
    });
  </script>
</body>
</html>
