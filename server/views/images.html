<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>이미지 업로드</title>
</head>
<body>
  <h1>이미지 업로드</h1>

  <form id="upload-form" enctype="multipart/form-data">
    <input type="file" name="images" id="image-input" multiple required><br><br>
  </form>

  <button id="next-button">다음 단계로 이동</button>

  <script>
    const productId = window.location.pathname.split('/')[3];

    const imageInput = document.getElementById('image-input');
    const nextButton = document.getElementById('next-button');

    imageInput.addEventListener('change', async function () {
      const formData = new FormData();
      for (const file of imageInput.files) {
        formData.append('images', file);
      }

      try {
        const res = await fetch(`/api/s-products/${productId}/images`, {
          method: 'POST',
          body: formData
        });

        const result = await res.json();

        if (res.ok) {
          alert('이미지 업로드 성공!');
          console.log('업로드된 이미지 URL:', result.urls);
        } else {
          alert('업로드 실패: ' + result.message);
        }
      } catch (err) {
        alert('에러 발생: ' + err.message);
      }
    });

    nextButton.addEventListener('click', function () {
      window.location.href = `/api/s-products/${productId}/description/ai-gen`;
    });
  </script>
</body>
</html>
